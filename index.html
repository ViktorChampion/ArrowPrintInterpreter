<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrowPrint — esoteric programming language</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <h1>➡️ ArrowPrint</h1>
                    <p id="tagline">An esoteric programming language on a 2D grid</p>
                </div>
                <div class="header-right">
                    <button id="langToggle" class="lang-btn">🇷🇺 Русский</button>
                </div>
            </div>
        </header>

        <div class="main">
            <div class="editor-section">
                <div class="toolbar">
                    <button id="runBtn">▶ <span id="runText">Run</span></button>
                    <button id="clearBtn">✕ <span id="clearText">Clear</span></button>
                    <span class="examples-label" id="examplesLabel">Examples:</span>
                    <div class="examples" id="examplesContainer"></div>
                </div>
                <textarea id="codeInput" spellcheck="false" placeholder="Your code: "></textarea>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <span id="outputLabel">📤 Output</span>
                    <button id="clearOutputBtn">✕</button>
                </div>
                <div id="terminal">
                    <pre id="output"><span class="prompt">> </span><span id="readyText">Ready</span></pre>
                    <div id="input-line" style="display:none;">
                        <span class="prompt">⌨️ </span>
                        <input type="text" id="terminal-input" autofocus>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p id="footerText">ArrowPrint v1.0 · <a href="https://github.com/ViktorChampion/arrowprint" target="_blank">GitHub</a> · <a href="https://esolangs.org/wiki/ArrowPrint" target="_blank">Esolang Wiki</a></p>
        </footer>
    </div>

    <script src="examples.js"></script>
    <script src="script.js"></script>
</body>
</html>
